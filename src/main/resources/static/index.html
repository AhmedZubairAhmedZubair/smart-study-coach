<!DOCTYPE html>
<html>
<head>
    <title>Smart Study Coach AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Smart Study Coach AI</h1>
        <p>Generate notes, quiz questions, and practice problems for any topic.</p>
    </div>

    <div class="input-box">
        <input type="text" id="topic" placeholder="Enter topic e.g. Binary Search Tree">

        <select id="difficulty">
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
        </select>

        <button onclick="generateStudy()">Generate Study Material</button>
        <button onclick="loadHistory()" class="secondary-btn">View History</button>
        <button onclick="loadQuizHistory()" class="secondary-btn">View Quiz History</button>
    </div>

    <div id="result"></div>

    <div id="history"></div>
</div>

<script src="app.js"></script>
</body>
</html>
